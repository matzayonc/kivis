[package]
name = "kivis-fs"
version = "0.2.0"
edition = "2024"
description = "File system storage backend for kivis databases with human-readable CSV persistence"
license = "MIT"
repository = "https://github.com/matzayonc/kivis"
homepage = "https://github.com/matzayonc/kivis"
documentation = "https://docs.rs/kivis-fs"
keywords = ["kivis", "storage", "filesystem", "database", "csv"]
categories = ["database", "filesystem"]
authors = ["Mateusz Zając <matzayonc@gmail.com>"]

[dependencies]
kivis = { workspace = true }
serde = { workspace = true, features = ["std"] }
csv = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
